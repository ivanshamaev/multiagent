name: course-pages

on:
  push:
    branches: [main]
    paths:
      - "course/**"
      - "Makefile"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/course-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: course-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install pinned renderer font
        run: |
          set -euo pipefail
          echo "89c3c497f618fdaa0b2d1e98fef93582f28c71debd2c4a8cdf41f190ced2909d  course/fonts/NotoSans-Regular.ttf" | sha256sum -c -
          sudo install -m 0644 course/fonts/NotoSans-Regular.ttf \
            /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
          sudo fc-cache -f
          test "$(sha256sum "$(fc-match -f '%{file}' 'Noto Sans')" | cut -d' ' -f1)" = \
            "89c3c497f618fdaa0b2d1e98fef93582f28c71debd2c4a8cdf41f190ced2909d"

      - name: Bootstrap Python environment
        run: make bootstrap

      - name: Install locked renderer
        run: make course-renderer-install

      - name: Fix Chrome SUID sandbox helper
        run: |
          set -euo pipefail
          helper=$(find "$HOME/.cache/puppeteer" course/node_modules/.cache/puppeteer \
            \( -name chrome_sandbox -o -name chrome-sandbox \) -type f 2>/dev/null | head -1 || true)
          if [ -n "$helper" ]; then
            sudo chown root:root "$helper"
            sudo chmod 4755 "$helper"
          fi

      - name: Diagnose renderer (single test diagram)
        run: |
          set +e
          mkdir -p build/diag
          printf 'flowchart TD\n  A[Start] --> B[End]\n' > build/diag/diag.mmd
          printf 'body{font-family:"Noto Sans";}\n' > build/diag/fonts.css
          PATH="$PWD/course/node_modules/node/bin:$PATH" \
            node course/node_modules/@mermaid-js/mermaid-cli/src/cli.js \
            -i build/diag/diag.mmd -o build/diag/out.svg \
            -c course/diagram-config.json -C build/diag/fonts.css -b transparent
          echo "diagnostic exit: $?"

      - name: Metadata and Markdown checks
        run: make course-check

      - name: Build course site
        run: make course-build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/course

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
