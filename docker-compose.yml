name: ${COMPOSE_PROJECT_NAME:-agentic-data-platform}

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "2"
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-YWdlbnRpYy1kYXRhLXBsYXRmb3JtLWZlcm5ldC0wMV8=}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow_dev_only}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-YWdlbnRpYy1kYXRhLXBsYXRmb3JtLWp3dC1kZXYtMDE=}
  AIRFLOW__API_AUTH__JWT_ISSUER: agentic-data-platform-airflow
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-YWdlbnRpYy1kYXRhLXBsYXRmb3JtLWFwaS1kZXYtMDE=}
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

x-airflow-common: &airflow-common
  image: ${AIRFLOW_COSMOS_IMAGE:-agentic-data-platform-airflow:3.3.1-cosmos1.15.0-dbt1.11.14}
  build:
    context: .
    dockerfile: platform/airflow/Dockerfile
  environment: *airflow-common-env
  user: "${AIRFLOW_UID:-50000}:0"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - ./platform/airflow/dags:/opt/airflow/dags:ro
    - ./platform/dbt:/opt/airflow/dbt:ro
    - ./platform/airflow/fixtures:/opt/airflow/fixtures:ro
    - ./platform/clickhouse/tests:/opt/airflow/checks:ro
    - airflow-logs:/opt/airflow/logs
  networks:
    - data-platform

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.33.6@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77}
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agentic}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-agentic_dev_only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      MCP_CLICKHOUSE_READER_PASSWORD: ${MCP_CLICKHOUSE_READER_PASSWORD:-mcp_reader_dev_only}
      MCP_DBT_PASSWORD: ${MCP_DBT_PASSWORD:-dbt_agent_dev_only}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}"
          --query "SELECT 1"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - data-platform
      - grader
      - mcp

  dbt:
    image: ${DBT_IMAGE:-agentic-data-platform-dbt:1.11.14-1.10.2}
    build:
      context: ./platform/dbt
      dockerfile: Dockerfile
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agentic}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-agentic_dev_only}
      DBT_PROFILES_DIR: /workspace
    volumes:
      - ${DBT_PROJECT_PATH:-./platform/dbt}:/workspace
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - data-platform

  clickhouse-mcp:
    image: ${CLICKHOUSE_MCP_IMAGE:-ghcr.io/clickhouse/mcp-clickhouse:0.6.0@sha256:b437cf15922702563d59124ad15f86337d93169cf2831d7fac6756d5dc23abff}
    environment:
      CHDB_ENABLED: "false"
      CLICKHOUSE_ALLOW_DROP: "false"
      CLICKHOUSE_ALLOW_WRITE_ACCESS: "false"
      CLICKHOUSE_CONNECT_TIMEOUT: "5"
      CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_MCP_MAX_WORKERS: "1"
      CLICKHOUSE_MCP_QUERY_TIMEOUT: "15"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: stdio
      CLICKHOUSE_PASSWORD: ${MCP_CLICKHOUSE_READER_PASSWORD:-mcp_reader_dev_only}
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_USER: ${MCP_CLICKHOUSE_USER:-mcp_reader}
      CLICKHOUSE_VERIFY: "true"
      FASTMCP_CHECK_FOR_UPDATES: "off"
      FASTMCP_SHOW_SERVER_BANNER: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - mcp

  dbt-mcp:
    image: ${DBT_MCP_IMAGE:-agentic-data-platform-dbt-mcp:2.2.1-dbt1.11.14}
    build:
      context: ./mcp/dbt
      dockerfile: Dockerfile
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${MCP_DBT_PASSWORD:-dbt_agent_dev_only}
      CLICKHOUSE_USER: ${MCP_DBT_USER:-dbt_agent}
      DBT_CLI_TIMEOUT: "120"
      DBT_MCP_ENABLE_TOOLS: parse,compile,build,test,show,list,get_lineage_dev,get_node_details_dev
      DBT_PATH: /usr/local/bin/dbt
      DBT_PROFILES_DIR: /workspace
      DBT_PROJECT_DIR: /workspace
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DISABLE_MCP_APPS: "true"
      FASTMCP_CHECK_FOR_UPDATES: "off"
      FASTMCP_SHOW_SERVER_BANNER: "false"
      MCP_TRANSPORT: stdio
    volumes:
      - ${DBT_PROJECT_PATH:-./platform/dbt}:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - mcp

  scenario-grader:
    image: ${SCENARIO_GRADER_IMAGE:-agentic-data-platform-grader:0.1.0}
    build:
      context: .
      dockerfile: grader/Dockerfile
    environment:
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123/
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agentic}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-agentic_dev_only}
    volumes:
      - ${SCENARIO_WORKSPACE_PATH:-./.scenario-state/workspaces/net-revenue}:/submission:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles:
      - grader
    networks:
      - grader

  airflow-postgres:
    image: ${AIRFLOW_POSTGRES_IMAGE:-postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825}
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_dev_only}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - data-platform

  airflow-init:
    <<: *airflow-common
    command: python /opt/airflow/ensure_mcp_viewer.py
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow_dev_only}
      AIRFLOW_MCP_USERNAME: ${AIRFLOW_MCP_USERNAME:-airflow_observer}
      AIRFLOW_MCP_PASSWORD: ${AIRFLOW_MCP_PASSWORD:-airflow_observer_dev_only}
      AIRFLOW_TRIGGER_USERNAME: ${AIRFLOW_TRIGGER_USERNAME:-airflow_trigger}
      AIRFLOW_TRIGGER_PASSWORD: ${AIRFLOW_TRIGGER_PASSWORD:-airflow_trigger_dev_only}
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/v2/monitor/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agentic}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-agentic_dev_only}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          airflow jobs check
          --job-type SchedulerJob
          --hostname "$${HOSTNAME}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    environment:
      <<: *airflow-common-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agentic}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-agentic_dev_only}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          airflow jobs check
          --job-type DagProcessorJob
          --hostname "$${HOSTNAME}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_METRICS_PORT:-8888}:8888"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    depends_on:
      tempo:
        condition: service_started
    profiles:
      - observability
    networks:
      - observability
      - observability-otel-host

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    networks:
      - observability
      - observability-tempo-host

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HTTP_PORT:-9090}:9090"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - observability
    networks:
      - observability
      - observability-prometheus-host

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283}
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HTTP_PORT:-3000}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    profiles:
      - observability
    networks:
      - observability
      - observability-grafana-host

volumes:
  clickhouse-data:
  airflow-postgres-data:
  airflow-logs:
  tempo-data:
  prometheus-data:
  grafana-data:

networks:
  data-platform:
    driver: bridge
  grader:
    driver: bridge
    internal: true
  mcp:
    driver: bridge
    internal: true
  observability:
    driver: bridge
    internal: true
  observability-otel-host:
    driver: bridge
  observability-tempo-host:
    driver: bridge
  observability-prometheus-host:
    driver: bridge
  observability-grafana-host:
    driver: bridge
