extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  tail_sampling:
    decision_wait: 2s
    decision_wait_after_root_received: 500ms
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: sample-healthy-quarter
        type: probabilistic
        probabilistic:
          sampling_percentage: 25
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 1s

connectors:
  span_metrics:
    namespace: agentic
    histogram:
      unit: ms
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      - name: agentic.role.name
      - name: gen_ai.request.model
      - name: agentic.tool.name
      - name: agentic.workflow.stage
      - name: agentic.receipt.hit
    exclude_dimensions: [collector.instance.id]
    aggregation_cardinality_limit: 1000
    aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
    metrics_flush_interval: 1s
    exemplars:
      enabled: true
      max_per_data_point: 5

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/tempo, span_metrics]
    metrics/spanmetrics:
      receivers: [span_metrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
