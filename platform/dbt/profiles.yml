agentic_data_platform:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: 8123
      user: "{{ env_var('CLICKHOUSE_USER', 'agentic') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'agentic_dev_only') }}"
      schema: analytics
      threads: 1
      secure: false
      verify: false
      connect_timeout: 10
      send_receive_timeout: 300
      retries: 2
      custom_settings:
        join_use_nulls: 1
