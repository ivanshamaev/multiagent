version: 2

sources:
  - name: raw
    description: Deterministic ecommerce source generated by the local seed.
    schema: raw
    tables:
      - name: customers
        description: One row per customer.
        columns:
          - name: customer_id
            data_tests: [not_null, unique]
          - name: country
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [US, DE, GB, TR, BR]
      - name: orders
        description: One row per order, including cancelled and refunded statuses.
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: customer_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'customers')
                    field: customer_id
          - name: order_status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [completed, cancelled, refunded]
          - name: currency
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [USD, EUR, GBP, TRY]
      - name: payments
        description: Payment attempts; an order may have multiple rows.
        columns:
          - name: payment_id
            data_tests: [not_null, unique]
          - name: order_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'orders')
                    field: order_id
          - name: payment_status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [succeeded, voided]
      - name: refunds
        description: Refund attempts; failed and multiple partial refunds are retained.
        columns:
          - name: refund_id
            data_tests: [not_null, unique]
          - name: order_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'orders')
                    field: order_id
          - name: refund_status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [succeeded, failed]
      - name: order_items
        description: Three deterministic line items per order.
        columns:
          - name: order_item_id
            data_tests: [not_null, unique]
          - name: order_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'orders')
                    field: order_id
      - name: sessions
        description: Customer sessions; acquisition channel is intentionally nullable.
        columns:
          - name: session_id
            data_tests: [not_null, unique]
          - name: customer_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'customers')
                    field: customer_id
          - name: acquisition_channel
            data_tests:
              - accepted_values:
                  arguments:
                    values: [organic, paid_search, email, affiliate]
      - name: marketing_attribution
        description: Attribution events with 100 intentional duplicate event identifiers.
        columns:
          - name: attribution_event_id
            data_tests: [not_null]
          - name: order_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'orders')
                    field: order_id
          - name: session_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'sessions')
                    field: session_id
          - name: acquisition_channel
            data_tests:
              - accepted_values:
                  arguments:
                    values: [organic, paid_search, email, affiliate]
