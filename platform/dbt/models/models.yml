version: 2

models:
  - name: stg_customers
    description: Clean customer source at one row per customer.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
  - name: stg_orders
    description: Clean order source at one row per order.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
  - name: stg_payments
    description: Clean payment attempts at one row per payment.
    columns:
      - name: payment_id
        data_tests: [not_null, unique]
  - name: stg_refunds
    description: Clean refund attempts at one row per refund.
    columns:
      - name: refund_id
        data_tests: [not_null, unique]
  - name: int_order_payments
    description: Successful payment aggregates at one row per order with payment attempts.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: successful_payment_count
        data_tests: [not_null]
      - name: successful_payment_amount_cents
        data_tests: [not_null]
  - name: int_order_refunds
    description: Successful refund aggregates at one row per order with refund attempts.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: successful_refund_count
        data_tests: [not_null]
      - name: successful_refund_amount_cents
        data_tests: [not_null]
  - name: fct_orders
    description: Order fact at one row per order, with payment and refund components.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, cancelled, refunded]
      - name: successful_payment_amount_cents
        data_tests: [not_null]
      - name: successful_refund_amount_cents
        data_tests: [not_null]
  - name: dim_customers
    description: Customer dimension at one row per customer.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
