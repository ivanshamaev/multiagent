name: ${COMPOSE_PROJECT_NAME:-agentic-data-platform}

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "2"
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-YWdlbnRpYy1kYXRhLXBsYXRmb3JtLWZlcm5ldC0wMV8=}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow_dev_only}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-YWdlbnRpYy1kYXRhLXBsYXRmb3JtLWp3dC1kZXYtMDE=}
  AIRFLOW__API_AUTH__JWT_ISSUER: agentic-data-platform-airflow
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-YWdlbnRpYy1kYXRhLXBsYXRmb3JtLWFwaS1kZXYtMDE=}
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

x-airflow-common: &airflow-common
  image: ${AIRFLOW_DBT_IMAGE:-agentic-data-platform-airflow:3.3.1-dbt1.11.14-1.10.2}
  build:
    context: .
    dockerfile: platform/airflow/Dockerfile
  environment: *airflow-common-env
  user: "${AIRFLOW_UID:-50000}:0"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - ./platform/airflow/dags:/opt/airflow/dags:ro
    - ./platform/dbt:/opt/airflow/dbt:ro
    - ./platform/airflow/fixtures:/opt/airflow/fixtures:ro
    - ./platform/clickhouse/tests:/opt/airflow/checks:ro
    - airflow-dbt-artifacts:/opt/airflow/dbt-artifacts
    - airflow-logs:/opt/airflow/logs
  networks:
    - data-platform

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.33.6}
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agentic}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-agentic_dev_only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}"
          --query "SELECT 1"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - data-platform

  dbt:
    image: ${DBT_IMAGE:-agentic-data-platform-dbt:1.11.14-1.10.2}
    build:
      context: ./platform/dbt
      dockerfile: Dockerfile
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agentic}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-agentic_dev_only}
      DBT_PROFILES_DIR: /workspace
    volumes:
      - ./platform/dbt:/workspace
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - data-platform

  airflow-postgres:
    image: ${AIRFLOW_POSTGRES_IMAGE:-postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825}
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_dev_only}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - data-platform

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow_dev_only}
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/v2/monitor/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-agentic}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-agentic_dev_only}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          airflow jobs check
          --job-type SchedulerJob
          --hostname "$${HOSTNAME}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          airflow jobs check
          --job-type DagProcessorJob
          --hostname "$${HOSTNAME}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  clickhouse-data:
  airflow-postgres-data:
  airflow-logs:
  airflow-dbt-artifacts:

networks:
  data-platform:
    driver: bridge
