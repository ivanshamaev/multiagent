name: agentic_data_platform
version: 0.1.0
config-version: 2
require-dbt-version: [">=1.11.0", "<1.12.0"]

profile: agentic_data_platform

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages", "logs"]

models:
  agentic_data_platform:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
